# Damavand v1.4.1 + ZedSecure features: unsigned debug build for the v141-plus branch.
name: Damavand v141-plus Debug

on:
  workflow_dispatch:
  push:
    branches:
      - v141-plus
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: damavand-v141plus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Fetch the cores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/get-cores.sh android
          bash tools/get-aether.sh
          bash tools/get-mihomo.sh
          bash tools/strip-cores.sh

      - name: Verify the cores
        run: |
          set -e
          ls -l app/libs/zedcore.aar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libzeptun-jni libaether libpsiphon-tunnel-core liblyrebird libmihomo; do
              [ -f "app/src/main/jniLibs/$abi/$lib.so" ] || { echo "::error::$abi/$lib.so is missing"; exit 1; }
            done
          done

      - name: Build the debug APKs
        run: ./gradlew :app:assembleDebug --no-daemon -x lint

      - name: Upload the artifact
        uses: actions/upload-artifact@v7
        with:
          name: Damavand-v141plus-debug
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk
