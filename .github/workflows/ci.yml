# Damavand Lite — build, sign, verify, release (private repo).
name: Damavand Lite

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: damavandlite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Fetch the cores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/get-cores.sh android
          bash tools/strip-cores.sh

      # 3.0.0: the minimal Xray-only core (package libv2ray, same Java
      # API as zedcore) is built here and written to app/libs/zedcore.aar
      # — the Gradle file dep and the verify step below need no change.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Build the Lite core
        run: bash tools/build-core.sh

      - name: Verify the cores
        run: |
          set -e
          ls -l app/libs/zedcore.aar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libzeptun-jni libpsiphon-tunnel-core liblyrebird; do
              [ -f "app/src/main/jniLibs/$abi/$lib.so" ] || { echo "::error::$abi/$lib.so is missing"; exit 1; }
            done
          done

      # NOTE: actions/upload-artifact is unusable on this account — its
      # artifact storage quota is hit even with zero artifacts retained.
      # Deliver the APK as a release asset instead; release assets do not
      # count against the Actions artifact quota.
      #
      # DRAFT MODE: the release is created as a DRAFT (not published)
      # until Amir says to publish; flip by removing --draft from the
      # gh release create line below and undrafting the release.
      # Release policy: release builds only, named
      # Damavand-Lite-<version>-<abi>.apk for arm64-v8a, armeabi-v7a and
      # universal. No debug APKs are published, and no "debug" appears in
      # file names.
      #
      # Signing: the APKs are signed here with this repo's OWN stable
      # release keystore, kept in the repo secrets APP_KEYSTORE_BASE64 /
      # APP_KEYSTORE_PASSWORD / APP_KEYSTORE_ALIAS / APP_KEY_PASSWORD.
      # This key is DIFFERENT from the Damavand repo's key (secrets do
      # not copy between repos), so 2.0.0 needs one uninstall of the old
      # Lite build first; after that, every build carries the same
      # signature, so updates install over the previous one with data
      # and settings preserved — as long as versionCode keeps increasing.
      - name: Build and publish the release APKs (arm64, armv7, universal)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gradlew loses its +x bit when pushed via the Contents API.
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon -x lint
          VER=$(grep '^damavand.versionName=' gradle.properties | cut -d= -f2)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "${{ secrets.APP_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          KEYPASS="${{ secrets.APP_KEY_PASSWORD }}"; [ -z "$KEYPASS" ] && KEYPASS="${{ secrets.APP_KEYSTORE_PASSWORD }}"
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --draft --title "Damavand Lite $VER" --notes "Damavand Lite $VER — arm64-v8a for most phones, armeabi-v7a for older 32-bit phones, universal for any device."
          for ABI in arm64-v8a armeabi-v7a universal; do
            "$BT/zipalign" -f -p 4 "app/build/outputs/apk/release/app-$ABI-release-unsigned.apk" "/tmp/$ABI-aligned.apk"
            "$BT/apksigner" sign --ks /tmp/release.jks --ks-key-alias "${{ secrets.APP_KEYSTORE_ALIAS }}" --ks-pass "pass:${{ secrets.APP_KEYSTORE_PASSWORD }}" --key-pass "pass:$KEYPASS" --out "Damavand-Lite-$VER-$ABI.apk" "/tmp/$ABI-aligned.apk"
            gh release upload "v$VER" "Damavand-Lite-$VER-$ABI.apk" --clobber
          done
