# Damavand v1.4.1 + ZedSecure features: unsigned debug build for the v141-plus branch.
name: Damavand v141-plus Debug

on:
  workflow_dispatch:
  push:
    branches:
      - v141-plus
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: damavand-v141plus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Fetch the cores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/get-cores.sh android
          bash tools/get-aether.sh
          bash tools/strip-cores.sh

      - name: Verify the cores
        run: |
          set -e
          ls -l app/libs/zedcore.aar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libzeptun-jni libaether libpsiphon-tunnel-core liblyrebird; do
              [ -f "app/src/main/jniLibs/$abi/$lib.so" ] || { echo "::error::$abi/$lib.so is missing"; exit 1; }
            done
          done

      - name: Build the debug APKs
        run: ./gradlew :app:assembleDebug --no-daemon -x lint

      # NOTE: actions/upload-artifact is unusable on this account — its
      # artifact storage quota is hit even with zero artifacts retained.
      # Deliver the APKs as assets of a rolling prerelease instead; release
      # assets do not count against the Actions artifact quota.
      - name: Publish the APKs as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v141-plus-debug >/dev/null 2>&1 || gh release create v141-plus-debug --prerelease --title "Damavand v141-plus (debug)" --notes "Debug build of Damavand v1.4.1 + ZedSecure features (branch v141-plus). Install app-arm64-v8a-debug.apk on arm64 phones."
          gh release upload v141-plus-debug app/build/outputs/apk/debug/*.apk --clobber

      # Optimized build: R8-minified release (unsigned in Gradle — no
      # keystore.properties on this branch), signed here with a throwaway CI
      # key purely so it can be installed for testing. Package is
      # com.amyrmo.damavand (no .debug suffix): it does not update the
      # installed v1 (different key) or the .debug builds (other package).
      - name: Build and publish the optimized release APK (arm64)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon -x lint
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -keystore /tmp/ci-release.jks -alias ci -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname "CN=Damavand CI"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk /tmp/arm64-aligned.apk
          "$BT/apksigner" sign --ks /tmp/ci-release.jks --ks-pass pass:android --key-pass pass:android --out app-arm64-v8a-release.apk /tmp/arm64-aligned.apk
          gh release upload v141-plus-debug app-arm64-v8a-release.apk --clobber
