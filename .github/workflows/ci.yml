# Damavand v1.4.1 + ZedSecure features: unsigned debug build for the v141-plus branch.
name: Damavand v141-plus Debug

on:
  workflow_dispatch:
  push:
    branches:
      - v141-plus
    paths-ignore:
      - '**/*.md'

permissions:
  contents: write

concurrency:
  group: damavand-v141plus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Fetch the cores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tools/get-cores.sh android
          bash tools/strip-cores.sh

      - name: Verify the cores
        run: |
          set -e
          ls -l app/libs/zedcore.aar
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libtor libobfs4proxy libsnowflake libconjure libsnispoof libhev-socks5-tunnel libzeptun-jni libpsiphon-tunnel-core liblyrebird; do
              [ -f "app/src/main/jniLibs/$abi/$lib.so" ] || { echo "::error::$abi/$lib.so is missing"; exit 1; }
            done
          done

      # NOTE: actions/upload-artifact is unusable on this account — its
      # artifact storage quota is hit even with zero artifacts retained.
      # Deliver the APK as a release asset instead; release assets do not
      # count against the Actions artifact quota.
      #
      # DRAFT MODE (Amir, 2026-11-07): the release is created as a DRAFT
      # (not published) until Amir says to publish; flip by removing --draft
      # from the gh release create line below and undrafting the release.
      # Release policy (Amir, 2026-11-06): release builds only, named
      # Damavand-<version>-<abi>.apk for arm64-v8a, armeabi-v7a and
      # universal. No debug APKs are published, and no "debug" appears in
      # file names.
      #
      # Optimized build: R8-minified release (unsigned in Gradle — no
      # keystore.properties on this branch), signed here with the STABLE
      # release keystore kept in the pre-provisioned repo secrets
      # APP_KEYSTORE_BASE64 / APP_KEYSTORE_PASSWORD / APP_KEYSTORE_ALIAS
      # / APP_KEY_PASSWORD (Amir's order, 2026-11-10: app updates must
      # install in place). Every build carries the same signature, so a
      # new build installs over the previous one with data and settings
      # preserved — as long as versionCode keeps increasing.
      - name: Build and publish the release APKs (arm64, armv7, universal)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon -x lint
          VER=$(grep '^damavand.versionName=' gradle.properties | cut -d= -f2)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "${{ secrets.APP_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.jks
          KEYPASS="${{ secrets.APP_KEY_PASSWORD }}"; [ -z "$KEYPASS" ] && KEYPASS="${{ secrets.APP_KEYSTORE_PASSWORD }}"
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --draft --title "Damavand $VER" --notes "Damavand $VER — arm64-v8a for most phones, armeabi-v7a for older 32-bit phones, universal for any device."
          for ABI in arm64-v8a armeabi-v7a universal; do
            "$BT/zipalign" -f -p 4 "app/build/outputs/apk/release/app-$ABI-release-unsigned.apk" "/tmp/$ABI-aligned.apk"
            "$BT/apksigner" sign --ks /tmp/release.jks --ks-key-alias "${{ secrets.APP_KEYSTORE_ALIAS }}" --ks-pass "pass:${{ secrets.APP_KEYSTORE_PASSWORD }}" --key-pass "pass:$KEYPASS" --out "Damavand-$VER-$ABI.apk" "/tmp/$ABI-aligned.apk"
            gh release upload "v$VER" "Damavand-$VER-$ABI.apk" --clobber
          done
