# Damavand v2 version catalog. Kotlin/AGP/SDK levels are pinned by
# architecture.md §1.3 (carried over from the v1 tree, where they are proven).
# Entries marked VERIFY were not resolvable from this VM (no Maven access was
# exercised); they are the closest known stable and must be confirmed against
# Maven Central / Google Maven at first CI run.
[versions]
agp = "9.3.2"
# 2.4.21 (newest stable): Haze 2.1.0 and the resolved stdlib carry Kotlin 2.4
# metadata, which the 2.2 compiler cannot read (CI run 41613463403). JetBrains'
# tested AGP range for KGP 2.4.20-2.4.21 tops at 9.3.1 and the docs explicitly
# allow newer AGP patch releases; AGP itself only enforces a minimum KGP.
kotlin = "2.4.21"

composeBom = "2026.09.00"
material3Expressive = "1.5.0-beta01" # as in v1; architecture §1.3 wants Material 3 Expressive

coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
datastore = "1.2.1"

coroutines = "1.11.0"
serializationJson = "1.11.0"

# VERIFY: architecture §1.3/§5.3 adopts Haze 2.1 (dev.chrisbanes.haze). 2.1.0 is
# the spec's target; module names below follow the spec's list.
haze = "2.1.0"
# VERIFY: kaml (YAML for the structured Mihomo edits, D7). 0.62.2 is the
# closest known stable.
kaml = "0.62.2"

zxing = "3.5.3"

junit5 = "5.11.4"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3Expressive" }

haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
haze-blur-material3 = { group = "dev.chrisbanes.haze", name = "haze-blur-material3", version.ref = "haze" }
haze-glass-material3 = { group = "dev.chrisbanes.haze", name = "haze-glass-material3", version.ref = "haze" }

kaml = { group = "com.charleskorn.kaml", name = "kaml", version.ref = "kaml" }

# QR rendering for config sharing (§5.2 Servers overflow: share link/QR).
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit5" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
# Version managed by junit-bom above (platform 1.11.4 for JUnit 5.11.4).
# Gradle 9 no longer bundles the platform launcher, so test tasks need it
# on the runtime classpath explicitly (CI jvm-tests failure, 2026-11-03).
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
